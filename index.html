<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Take a pause</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="pause-card" aria-labelledby="pauseTitle">
      <p class="eyebrow">Instagram Pause</p>
      <h1 id="pauseTitle">You have been here for 30 minutes.</h1>
      <p class="message">Would you like to continue?</p>
      <button id="continueButton" type="button">Continue to Instagram</button>
    </main>
    <script src="./continue.js"></script>
  </body>
</html>
