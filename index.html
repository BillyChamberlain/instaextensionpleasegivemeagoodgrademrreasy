<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Take a pause</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="pause-card" aria-labelledby="pauseTitle">
      <div class="terminal-header">
        <p class="eyebrow">Instagram Pause // Runtime Monitor</p>
        <span class="status" aria-label="System status">SYS_PAUSED</span>
      </div>
      <div class="crash-log" aria-live="polite">
        <p class="log-line log-label">CRASH LOG / SESSION INTERRUPTION</p>
        <h1 id="pauseTitle" class="log-line">You have been here for 30 minutes.</h1>
        <p class="log-line message">The site has been paused before the scroll can continue.</p>
        <p class="log-line log-detail">[01] attention budget exceeded<br />[02] infinite feed detected<br />[03] human override required</p>
      </div>
      <button id="continueButton" type="button">Continue to Instagram</button>
    </main>
    <script src="./continue.js"></script>
  </body>
</html>
